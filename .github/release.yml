# release.yml

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - octocat
  categories:
    - title: Breaking Changes 🛠
      labels:
        - Semver-Major
        - breaking-change
    - title: Exciting New Features 🎉
      labels:
        - Semver-Minor
        - enhancement
    # A PR goes in the first category whose labels it has, so a breaking bug fix stays under Breaking Changes
    - title: Bug Fixes 🐛
      labels:
        - bug
    # The docs site, README and Umbraco Marketplace listing
    - title: Documentation 📖
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
