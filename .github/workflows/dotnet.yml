name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitVersion.MsBuild works out the package version from git tags when releasing. It fails on pull
      # request refs, and CI builds don't need a real version, so they get 0.0.0-ci.<run> instead.
      DisableGitVersionTask: 'true'
      Version: 0.0.0-ci.${{ github.run_number }}

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    # The .NET 8 SDK builds the library's net5.0 and net6.0 targets (the .NET 5 SDK no longer installs on
    # current runners). The .NET 6 runtime runs the tests, against the library's net6.0 build.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: Restore dependencies
      run: dotnet restore
      working-directory: Our.Umbraco.TagHelpers

    - name: Build
      run: dotnet build --no-restore
      working-directory: Our.Umbraco.TagHelpers

    - name: Test
      run: dotnet test
      working-directory: Our.Umbraco.TagHelpers.Tests

    - name: Dotnet Pack
      run: dotnet pack --output ../build.out/
      working-directory: Our.Umbraco.TagHelpers

    - name: Upload nuget file as build artifact
      uses: actions/upload-artifact@v7
      with:
        name: Nuget Build Output
        path: ./build.out/
