name: Cross-version tests

# Packs the NuGet package once and attaches the .nupkg and .snupkg to the run, then boots the demo site on each
# supported Umbraco version and runs the Playwright specs in tests/e2e against it
# (see tests/e2e/playwright.config.ts), both with the project and with that package.
on:
  pull_request:
  push:
    branches: [ v2/dev ]
  workflow_dispatch:

jobs:
  pack:
    name: Pack NuGet package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      # <Version> without its prerelease part, plus -ci.<run number>: e.g. 2.1.0-ci.42 for 2.1.0-rc1.
      # NuGet sorts it below 2.1.0-rc1 and 2.1.0, so a CI package never looks newer than a release,
      # and every run's package has its own version.
      - name: Work out the CI package version
        id: version
        run: |
          base=$(dotnet msbuild Our.Umbraco.TagHelpers/Our.Umbraco.TagHelpers.csproj -getProperty:Version -nologo)
          echo "version=${base%%-*}-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: pwsh ./build.ps1 -Version ${{ steps.version.outputs.version }}

      # Unzipped (archive: false), so each downloads as the file itself; the artifact is named after the file
      - name: Attach the .nupkg to the run
        uses: actions/upload-artifact@v7
        with:
          path: build.out/Our.Umbraco.TagHelpers.${{ steps.version.outputs.version }}.nupkg
          archive: false
          if-no-files-found: error

      - name: Attach the .snupkg (symbols) to the run
        uses: actions/upload-artifact@v7
        with:
          path: build.out/Our.Umbraco.TagHelpers.${{ steps.version.outputs.version }}.snupkg
          archive: false
          if-no-files-found: error

  e2e:
    needs: pack
    name: Umbraco ${{ matrix.umbraco }} (${{ matrix.os }}, ${{ matrix.source }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Umbraco 19 is a release candidate: report failures without blocking the PR.
    # Remove when the package moves to Umbraco 19.0.0 stable.
    continue-on-error: ${{ matrix.umbraco == 19 }}
    # bash on every OS (Git Bash on Windows), so a failing command in a multi-line step fails the step
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        umbraco: [16, 17, 18, 19]
        os: [ubuntu-latest]
        # project: the sites reference the Our.Umbraco.TagHelpers project (npm test)
        # package: the sites install the packed .nupkg, i.e. what would be published (npm run test:package)
        source: [project, package]
        # The test scripts must also work on Windows and macOS: run the LTS there too
        include:
          - umbraco: 17
            os: windows-latest
            source: project
          - umbraco: 17
            os: macos-latest
            source: project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install test dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The package jobs test the exact package the pack job attached to this run
      - name: Download the packed package
        if: matrix.source == 'package'
        uses: actions/download-artifact@v8
        with:
          pattern: Our.Umbraco.TagHelpers.*.nupkg
          path: ${{ runner.temp }}/nuget-package
          merge-multiple: true

      - name: Run Playwright tests
        working-directory: tests/e2e
        env:
          UMBRACO_VERSIONS: ${{ matrix.umbraco }}
          E2E_PACKAGE_DIR: ${{ matrix.source == 'package' && format('{0}/nuget-package', runner.temp) || '' }}
        # npm test builds the library first; npm run test:package installs the attached package instead
        run: ${{ matrix.source == 'package' && 'npm run test:package' || 'npm test' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-v${{ matrix.umbraco }}-${{ matrix.os }}-${{ matrix.source }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/.data/v${{ matrix.umbraco }}/site.log
          retention-days: 14
