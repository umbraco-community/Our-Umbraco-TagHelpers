name: Cross-version tests

# Boots the demo site on each supported Umbraco version and runs the Playwright
# specs in tests/e2e against it (see tests/e2e/playwright.config.ts).
on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Umbraco ${{ matrix.umbraco }} (${{ matrix.os }}, ${{ matrix.source }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Umbraco 19 is a release candidate: report failures without blocking the PR.
    # Remove when the package moves to Umbraco 19.0.0 stable.
    continue-on-error: ${{ matrix.umbraco == 19 }}
    # bash on every OS (Git Bash on Windows), so a failing command in a multi-line step fails the step
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        umbraco: [16, 17, 18, 19]
        os: [ubuntu-latest]
        # project: the sites reference the Our.Umbraco.TagHelpers project (npm test)
        # package: the sites install the packed .nupkg, i.e. what would be published (npm run test:package)
        source: [project, package]
        # The test scripts must also work on Windows and macOS: run the LTS there too
        include:
          - umbraco: 17
            os: windows-latest
            source: project
          - umbraco: 17
            os: macos-latest
            source: project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install test dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: tests/e2e
        env:
          UMBRACO_VERSIONS: ${{ matrix.umbraco }}
        # npm test builds the library first; npm run test:package packs it and installs the package instead
        run: ${{ matrix.source == 'package' && 'npm run test:package' || 'npm test' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-v${{ matrix.umbraco }}-${{ matrix.os }}-${{ matrix.source }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/.data/v${{ matrix.umbraco }}/site.log
          retention-days: 14
