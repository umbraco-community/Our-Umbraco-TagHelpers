name: "CodeQL"

on:
  push:
    branches: [ v1/dev ]
  pull_request:
    branches: [ v1/dev ]
  schedule:
    - cron: '34 5 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      # GitVersion.MsBuild fails on pull request refs, and the analysis doesn't need a package version
      DisableGitVersionTask: 'true'

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # The .NET 8 SDK builds the net5.0 and net6.0 targets (the .NET 5 SDK no longer installs on current runners)
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
